name: 24/7 Quiz & Schedule Pinger

on:
  schedule:
    # Runs every 5 minutes 24/7
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Cron Tick
        run: |
          curl -s -f --retry 2 https://dailyquizeblitz.vercel.app/api/cron/tick || echo "Tick pinged"
